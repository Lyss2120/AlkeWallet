<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../assets/img/aw-logo.png" />
  <title>Send Money</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="../assets/css/alkewallet.css" />
</head>

<body>
  <!-- navbar -->
  <nav class="navbar navbar-expand-sm py-3">
    <div class="container text-light">
      <a class="navbar-brand" href="/">AlkeWallet</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav ms-auto">
          <a class="nav-link active" aria-current="page" href="index.html">Home</a>
          <a class="nav-link" href="menu.html">Menu</a>
          <a class="nav-link" href="deposit.html">Deposit</a>
          <a class="nav-link" href="sendMoney.html">Send Money</a>
          <a class="nav-link" href="transactions.html">Transactions</a>
          <!-- <a class="nav-link disabled" aria-disabled="true">Disabled</a> -->
        </div>
      </div>
    </div>
  </nav>
  <!-- header -->
  <header class="">
    <div class="container mt-5">
      <h1 class="text-center">Bienvenido a AlkeWallet</h1>
    </div>
  </header>
  <!-- main -->
  <main class="container-fluid p-5 rounded d-grid" id="sendMoney-container">
    <!-- formulario permite seleccionar o agregar contactos para realizar la transferencia -->
    <form action="" class="form-group">
      <legend>
        <h1 class="">Enviar Dinero</h1>
      </legend>
      <div class="form-group">
        <label for="recipient">Buscar en la agenda de transferencias</label>
        <!-- agregar nuevo contacto -->
        <input type="text" class="form-control" id="recipient" placeholder="Buscar contacto" />
        <button type="button" class="btn btn-primary mt-3">
          Agregar Nuevo contacto
        </button>
      </div>
      <!-- seleccionar contacto existente -->
      <h2 class="mt-3">Contactos</h2>
      <ul class="list-group">
        <li class="list-group-item">
          John Doe - CBU 123456789 - Alias John Doe - Banco ABC Bank
        </li>
        <li class="list-group-item">
          Jane Smith - CBU 987654321 - Alias Jane Smith - Banco XYZ Bank
        </li>
      </ul>
      <!-- boton submit para transferir a contacto mandar a deposit.html-->
      <button type="submit" class="btn btn-primary w-100">
        Enviar dinero
      </button>
      <!-- boton para volver al menu -->
      <button type="button" class="btn btn-secondary w-100">
        <a href="menu.html" class="text-light text-decoration-none">Volver al Menu</a>
      </button>
    </form>
  </main>
  <!-- footer -->
  <footer class="container-fluid h-10 bottom-0 px-0">
    <section class="footer-section bottom-0"></section>
  </footer>

  <!-- scripts -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="../assets/js/script.js"></script>
</body>

</html>
