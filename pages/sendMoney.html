<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Money</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>

<body>
    <main class="container container p-5 mt-5 rounded ">

        <section class=" ">

            <!-- formulario permite seleccionar o agregar contactos para realizar la transferencia -->
            <form action="" class="form-group">

                <legend><h1 class="">Enviar Dinero</h1></legend>

                <div class="form-group">
                    <label for="recipient">Buscar en la agenda de transferencias</label>
                    <!-- agregar nuevo contacto -->
                    <input type="text" class="form-control" id="recipient" placeholder="Buscar contacto">
                    <button type="button" class="btn btn-primary mt-3">Agregar Nuevo contacto</button>
                </div>

                <!-- seleccionar contacto existente -->
                <h2 class="mt-3">Contactos</h2>
                <ul class="list-group">
                    <li class="list-group-item">John Doe - CBU 123456789 - Alias John Doe - Banco ABC Bank</li>
                    <li class="list-group-item">Jane Smith - CBU 987654321 - Alias Jane Smith - Banco XYZ Bank</li>
                </ul>
                
                <!-- boton submit para transferir a contacto -->
                <button type="submit" class="btn btn-primary w-100">Enviar dinero</button>
                <!-- boton para volver al menu -->
                <button type="button" class="btn btn-secondary w-100 ">
                    <a href="/pages/menu.html" class="text-light  text-decoration-none">Volver al Menu</a>
                </button>
            </form>


        </section>



    </main>

    <script src=" assets/js/script.js"></script>
</body>

</html>
