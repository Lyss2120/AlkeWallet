  <!-- main -->
  <main class="container rounded d-grid mb-5 p-3" id="sendMoney-container">

    <section class="sendMoney-section row justify-content-center glass py-3">
      <div class="col-12 col-lg-10 ">
        <!-- BLOQUE 0: BALANCE -->
        <div class="d-flex justify-content-around align-items-center mb-4 p-3 border rounded bg-light bg-opacity-10">
          <div class="p-4">
            <h1 class="text-center text-light">Enviar Dinero</h1>
          </div>
          <h2 class="text-white h4 p-1 mb-0">
            Saldo disponible : <span id="balance"></span>
          </h2>
        </div>

        <!-- BLOQUE 1: Formulario Principal de Transferencia / Agregar nuevo contacto (Modal)-->
        <form id="form-transferir" class="p-5 form-control needs-validation d-block bg-light bg-opacity-10 p-4">
          <!-- Seleccionar contacto existente -->
          <div class="d-flex justify-content-around align-items-center">
            <h2 class="text-white h4  py-4 "> 
              <i class="bi bi-people mx-2 h1"></i>Transferir a contacto existente
            </h2>

            <h2 class="text-white h4  py-4">
              <button type="button" class="btn btn-outline-light rounded-pill mx-3" data-bs-toggle="modal"
                data-bs-target="#modalNuevoContacto">
                <i class="bi bi-person-add h2"></i>
              </button>¿Deseas agregar un nuevo contacto?
            </h2>


          </div>


          <input type="text" class="form-control mb-3" id="recipient" placeholder="Buscar contacto..." required />

          <!-- Lista de contactos dinámicos -->
          <ul class="list-group mb-4" id="lista-contactos">
            <!-- Los contactos del localStorage se cargarán aquí -->
            <!-- Ejemplos como respaldo visual inicial -->
            <li class="list-group-item list-group-item-action contacto-item">John Doe - Banco ABC Bank</li>
            <li class="list-group-item list-group-item-action contacto-item">Jane Smith - Banco XYZ Bank</li>
          </ul>

          <!-- Monto a transferir  -->
          <div class="input-group mb-3">
            <!-- <label for="monto-transferir" class="form-label text-white h4">Monto a transferir:</label> -->
            <input type="number" id="monto-transferir" class="form-control" aria-label="Recipient’s username"
              aria-describedby="button-addon2" placeholder="Monto en CLP" required>
            <!-- Botón submit para transferir dinero -->
            <button type="submit" id="button-addon2" class=" btn btn-light text-light-emphasis ">
              Transferir
            </button>
          </div>



          <!-- Botón para volver al menú -->
          <button type="button" class="btn btn-outline-light  w-100 my-3">
            <a href="menu.html" class="text-decoration-none text-light d-block h4 p-2">Volver al Menu</a>
          </button>
        </form>

      </div>
    </section>




    <!-- ========================================== -->
    <!-- MODAL DE BOOTSTRAP (AGREGAR NUEVO CONTACTO) -->
    <!-- ========================================== -->
    <div class="modal fade" id="modalNuevoContacto" tabindex="-1" aria-labelledby="modalContactoLabel"
      aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-dark">
          <div class="modal-header">
            <h5 class="modal-title" id="modalContactoLabel">Registrar Nuevo Contacto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="form-modal-contacto">
            <div class="modal-body">

              <div class="mb-3">
                <label for="reg-nombre" class="form-label">Nombre Completo</label>
                <input type="text" id="reg-nombre" class="form-control" placeholder="Ej. Juan Pérez" required>
              </div>

              <div class="mb-3">
                <label for="reg-rut" class="form-label">RUT</label>
                <input type="text" id="reg-rut" class="form-control" id="rut" title="Formato RUT"
                  pattern="^[0-9]{1,2}\.[0-9]{3}\.[0-9]{3}-[0-9kK]{1}$" placeholder="12.345.678-K" required>
              </div>

              <div class="mb-3">
                <label for="reg-banco" class="form-label">Banco</label>
                <select id="reg-banco" class="form-select" required>
                  <option value="" selected disabled>Selecciona un banco</option>
                  <option value="Banco de Chile">Banco de Chile</option>
                  <option value="Banco Estado">Banco Estado</option>
                  <option value="Banco Santander">Banco Santander</option>
                  <option value="BCI">BCI</option>
                  <option value="Scotiabank">Scotiabank</option>
                  <option value="Mach / Cuenta RUT">Mach / Cuenta RUT</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="reg-tipo" class="form-label">Tipo de Cuenta</label>
                <select id="reg-tipo" class="form-select" required>
                  <option value="Cuenta Corriente">Cuenta Corriente</option>
                  <option value="Cuenta Vista / RUT">Cuenta Vista / RUT</option>
                  <option value="Cuenta de Ahorro">Cuenta de Ahorro</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="reg-cuenta" class="form-label">Número de Cuenta</label>
                <input type="number" id="reg-cuenta" class="form-control" placeholder="Ej. 123456789" required>
              </div>

            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-success">Guardar Contacto</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>
