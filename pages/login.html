<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../assets/css/alkewallet.css" />
</head>

<body>
  <!-- navbar -->
  <nav class="navbar navbar-expand-sm py-3">
    <div class="container text-light">
      <a class="navbar-brand" href="/">AlkeWallet</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav ms-auto">
          <a class="nav-link active" aria-current="page" href="index.html">Home</a>
          <a class="nav-link" href="menu.html">Menu</a>
          <a class="nav-link" href="deposit.html">Deposit</a>
          <a class="nav-link" href="sendMoney.html">Send Money</a>
          <a class="nav-link" href="transactions.html">Transactions</a>
          <!-- <a class="nav-link disabled" aria-disabled="true">Disabled</a> -->
        </div>
      </div>
    </div>
  </nav>

  <header class="">
    <div class="container mt-5">
      <h1 class="text-center">Bienvenido a AlkeWallet</h1>
    </div>
  </header>
  <!-- main -->
  <main class="container-fluid p-5 rounded d-grid" id="login-container">
    <!-- background drops -->
    <section class="hero-section">
      <div class="d div1"></div>
      <div class="d div2"></div>
      <div class="d div3"></div>

      <!-- formulario de login -->
      <form class="col-lg-6 mx-auto glass p-4 row needs-validation rounded" novalidate>
        <fieldset>
          <legend class="text-center">
            <h2>Login</h2>
          </legend>

          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" />
          </div>
          <!-- checkbox para futura persistencia de datos -->
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="checkbox" />
            <label class="form-check-label" for="checkbox">Recordarme</label>
          </div>

          <button type="submit" class="btn btn-primary form-control">
            Login
          </button>

          <a class="link-light link-offset-2 link-underline link-underline-opacity-0" href="./pages/menu.html">
            <button type="button" class="btn-primary btn form-control">
              Menú Principal
            </button>
          </a>
        </fieldset>
      </form>
    </section>

    <section class="section primera">
      <!-- formulario de login -->
      <form class="col-lg-6 mx-auto bg-danger glass row needs-validation rounded" novalidate>
        <fieldset>
          <legend class="text-center">
            <h2>Login</h2>
          </legend>

          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" />
          </div>
          <!-- checkbox para futura persistencia de datos -->
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="checkbox" />
            <label class="form-check-label" for="checkbox">Recordarme</label>
          </div>

          <button type="submit" class="btn btn-primary form-control">
            Login
          </button>

          <a class="link-light link-offset-2 link-underline link-underline-opacity-0" href="./pages/menu.html">
            <button type="button" class="btn-primary btn form-control">
              Menú Principal
            </button>
          </a>
        </fieldset>
      </form>
    </section>
  </main>
  <!-- footer -->
  <footer class="container-fluid h-10 bottom-0 px-0">
    <section class="footer-section bottom-0"></section>
  </footer>

  <!-- scripts -->
   
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

  <!-- script del proyecto -->
  <script src="assets/js/script.js"></script>
