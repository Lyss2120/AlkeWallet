  <!-- main -->
     <main class="container rounded d-grid mb-5 p-3" id="login-container">

    <section class="login-section row justify-content-center glass py-3">
      <div class="col-12 col-lg-10 ">
        <!-- BLOQUE : HEADER-->
        <div class="d-flex justify-content-start align-items-center mb-4 p-3 border rounded bg-light bg-opacity-10">
          <div class="p-4 ms-5">
            <h1 class="text- ms-5 text-light">Login</h1>
          </div>

        </div>

        <!-- formulario de login -->


        <form id="loginForm" class="p-5 form-control needs-validation d-block bg-light bg-opacity-10 p-4">
          <!-- Seleccionar contacto existente -->

          <div class="mb-3 px-5 form-group">
            <label for="email" class="form-label  h4 text-light">Email </label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Ingresa tu email" required />
          </div>
          <div class="mb-3 px-5 form-group">
            <label for="password" class="form-label  h4 text-light">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password"
              placeholder="Ingresa tu contraseña" required />
          </div>
          <!-- checkbox para futura persistencia de datos -->
          <div class="mb-5 px-5 form-check">
            <input type="checkbox" class="form-check-input ms-2" name="recordarme" id="checkbox" />
            <label class="form-check-label ms-3 h6 text-light" for="checkbox">Recordarme</label>
          </div>

          <!-- Botón de Login Principal -->
          <button type="submit" value="Login" class="btn btn-lg btn-outline-light form-control  ">
           Login
          </button>

          <!-- Divisor visual -->
          <div class="text-center my-3 position-relative">
            <hr class="text-muted" />
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-2 text-muted  text-light small"></span>
          </div>

          <button class="text-center h2 text-light btn btn-outline-light form-control">
            No tienes cuenta?
            <a href="signUp.html" class="text-decoration-none text-light">Registrate aquí</a>
          </button>

        </form>



      </div>
    </section>
  </main>
