  <header class="pt-5 pb-3 mt-5">
    <h1 class="text-center">Login</h1>
  </header>
  <!-- main -->
  <main class="container rounded d-grid mb-5" id="login-container">
    <!-- background drops -->
    <section class="login-section row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8">
        <!-- formulario de login -->
        <form class="form-control" id="loginForm">
          <div class="mb-3 form-group">
            <label for="email" class="form-label">Email </label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Ingresa tu email" required />
          </div>
          <div class="mb-3 form-group">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" name="password"
              placeholder="Ingresa tu contraseña" required />
          </div>
          <!-- checkbox para futura persistencia de datos -->
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" name="recordarme" id="checkbox" />
            <label class="form-check-label" for="checkbox">Recordarme</label>
          </div>

          <!-- Botón de Login Principal -->
          <button type="submit" value="Login" class="btn btn-primary form-control mb-3">
            Login
          </button>

          <!-- Divisor visual -->
          <div class="text-center my-3 position-relative">
            <hr class="text-muted" />
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-2 text-muted small"></span>
          </div>

          <p class="text-center">
            No tienes cuenta?
            <a href="signUp.html" class="text-decoration-underline">Registrate aquí</a>
          </p>
