<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="../assets/img/aw-logo.png" />
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="../assets/css/alkewallet.css" />
  <!-- jquery -->
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <!-- head scripts + defer! -->
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <!-- js propio -->
  <script defer src="../assets/js/nav.js"></script>
  <script defer src="../assets/js/login.js"></script>
</head>

<body>
  <!-- NAV BAR (Estilo moderno, translúcido y limpio) -->
  <nav class="navbar navbar-expand-lg navbar-dark glass-effect rounded col-12 col-lg-11 mx-auto my-3 px-3 shadow-lg">
    <div class="container-fluid">
      <!-- Logo / Marca de la app -->
      <a class="navbar-brand fw-bold fs-4 text-light tracking-tight d-flex align-items-center gap-2"
        href="../index.html">
        <span>Alkewallet</span>
      </a>

      <!-- Botón responsive para móviles -->
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Enlaces de navegación -->
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <div class="navbar-nav align-items-center gap-2 mt-3 mt-lg-0">
          <a class="nav-link text-light opacity-75" href="../index.html">Inicio</a>
          <a class="nav-link text-light opacity-75" href="../index.html#testimonios-section">Testimonios</a>
          <a class="btn btn-sm btn-outline-info text-success rounded-pill px-4 fw-semibold nav-link ms-lg-3 login"
            href="./pages/signUp.html">Crear Cuenta</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- Orbes flotando en el fondo -->
  <div class="orbe-bg orbe-1"></div>
  <div class="orbe-bg orbe-2"></div>
  <div class="orbe-bg orbe-3"></div>

  <!-- MAIN (Mismo código estilizado del Login) -->
  <main class="container col-12 col-lg-6 my-5 p-0" id="login-container">
    <!-- Reemplazamos 'glass' por tu clase unificada 'glass-effect' y añadimos bordes redondeados -->
    <section class="login-section row justify-content-center glass-effect rounded p-4 m-0 shadow-lg">
      <div class="col-12">

        <!-- BLOQUE : HEADER (Simplificado y estilizado sin bordes dobles) -->
        <div class="text-center my-4">
          <h1 class="text-light display-5 fw-bold">Iniciar Sesión</h1>
          <p class="text-success opacity-75">Gestiona tus finanzas en movimiento</p>
        </div>

        <!-- Formulario de login -->
        <form id="loginForm"
          class="p-4 needs-validation bg-dark bg-opacity-25 rounded-3 border border-light border-opacity-10">

          <!-- Campo: Email -->
          <div class="mb-4">
            <label for="email" class="form-label h5 text-light opacity-90">Email</label>
            <input type="email" class="form-control bg-dark bg-opacity-50 text-white border-secondary" id="email"
              name="email" placeholder="nombre@ejemplo.com" required />
          </div>

          <!-- Campo: Contraseña -->
          <div class="mb-4">
            <label for="password" class="form-label h5 text-light opacity-90">Contraseña</label>
            <input type="password" class="form-control bg-dark bg-opacity-50 text-white border-secondary" id="password"
              name="password" placeholder="Ingresa tu contraseña" required />
          </div>

          <!-- Checkbox: Recordarme -->
          <div class="mb-4 form-check d-flex align-items-center gap-2">
            <input type="checkbox" class="form-check-input m-0" name="recordarme" id="checkbox" />
            <label class="form-check-label h6 text-light opacity-75 m-0" for="checkbox">Recordarme en este
              dispositivo</label>
          </div>

          <!-- Botón de Login Principal -->
          <button type="submit" class="btn btn-lg btn-light w-100 fw-semibold rounded-pill my-2 shadow-sm">
            Ingresar
          </button>

          <!-- Divisor visual moderno con texto 'o' -->
          <div class="text-center my-4 position-relative">
            <hr class="text-light opacity-25" />
            <span
              class="position-absolute top-50 start-50 translate-middle bg-dark px-3 text-light opacity-50 small rounded">o</span>
          </div>

          <!-- Enlace para registrarse -->
          <div class="text-center">
            <p class="text-light opacity-75 m-0">
              ¿No tienes cuenta?
              <a href="signUp.html"
                class="text-success fw-semibold text-decoration-none border-bottom border-success">Regístrate aquí</a>
            </p>
          </div>

        </form>

      </div>
    </section>
  </main>

  <!-- footer -->
  <footer class="glass-effect rounded col-12 col-lg-11 mx-auto my-4 py-4 px-4 bottom-0 shadow-lg">
    <div class="container-fluid p-0">
      <div class="row align-items-center text-center text-md-start g-3">
        <div class="col-12 col-md-6">
          <h5 class="text-white fw-bold mb-1">AlkeWallet</h5>
          <p class="text-light opacity-50 small m-0">&copy; 2026 AlkeWallet. Todos los derechos reservados.</p>
        </div>
        <div class="col-12 col-md-6 text-md-end">
          <a href="#" class="text-light opacity-75 text-hover-success text-decoration-none small me-3">Términos</a>
          <a href="#" class="text-light opacity-75 text-hover-success text-decoration-none small me-3">Privacidad</a>
          <a href="#" class="text-light opacity-75 text-hover-success text-decoration-none small">Soporte</a>
        </div>
      </div>
    </div>
  </footer>

</body>

</html>
