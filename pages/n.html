    <!-- header -->
    <header class="pt-5 pb-3 mt-5">
        <h1 class="text-center">Depositar</h1>
    </header>
    <!-- main -->
    <main class="container rounded d-grid mb-5" id="sendMoney-container">
        <section class="sendmoney-section row justify-content-center glass p-5">
            <div class="col-12 col-sm-10 col-md-8 ">

                <!-- BLOQUE 1: Agregar nuevo contacto (Modal) -->
                <div
                    class="d-flex justify-content-between align-items-center mb-4 p-3 border rounded bg-light bg-opacity-10">
                    <h2 class="text-white h4 mb-0">Balance de cuenta: <span id="balance"></span></h2>

                </div>

                <!-- BLOQUE 2: Formulario Principal de Transferencia -->
                <form id="form-transferir" class="form-control needs-validation justify-content-between align-items-center mb-4  border rounded bg-light bg-opacity-10 row g5 my5" >
                    <!-- Seleccionar contacto existente -->
                    <h2 class="text-white h4 my-5"> <span>Elige una tarjeta para depositar dinero a tu cuenta</span>
                        <div class="form-check form-check-inline d-flex justify-content-around" role="group"
                            aria-label="Basic radio toggle button group">
                            <input type="radio" class="btn-check" name="options-base" id="option5" autocomplete="off"
                                checked>
                            <label class="btn" for="option5"> ITAU</label>

                            <input type="radio" class="btn-check" name="options-base" id="option6" autocomplete="off">
                            <label class="btn" for="option6"> FALABELLA</label>

                            <input type="radio" class="btn-check" name="options-base" id="option7" autocomplete="off">
                            <label class="btn" for="option7"> BANCO CHILE</label>

                            <input type="radio" class="btn-check" name="options-base" id="option8" autocomplete="off">
                            <label class="btn" for="option8"> BANCO ESTADO</label>
                        </div>                      
                </form>
                <form class="form-control needs-validation d-block bg-light bg-opacity-10 p-4" id="form-deposito"
                    novalidate>
                    <!-- agregar clases is-valid o is-invalid junto a form-control con javascript -->
                    <div class="input-group pb-3">
                        <input type="number" class="form-control" id="monto" name="monto" placeholder="Enter amount"
                            aria-label="Recipient’s username" aria-describedby="button-addon2" required min="500">
                        <!-- fraces de validacion se muestran al cambiar clases is-valid o is-invalid -----
                            Buscar como modificar tipo de moneda en aria label -->
                        <div class="invalid-feedback">Please enter a valid amount.</div>
                        <div class="valid-feedback">Looks good!</div>
                        <button type="submit" id="button-addon2"
                            class=" btn btn-info text-light-emphasis ">Depositar</button>

                    </div>
                </form>
                

            </div>
        </section>
    </main>
