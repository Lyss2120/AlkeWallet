<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>

<body>
    <section class="container p-5 mt-5 rounded" id="transactions-section">
        <h2 class="text-center">Depositar</h2>
        <form class="row g-3 needs-validation" novalidate>
            <Legend>Monto a depositar</Legend>
            <div class="input-group has-validation mb-3">
                <span class="input-group-text">$</span>
                <!-- agregar clases is-valid o is-invalid junto a form-control con javascript  -->
                <input type="text" class="form-control " placeholder="Enter amount"
                    aria-label="Amount (to the nearest dollar)" aria-describedby="inputGroupPrepend" required>
                <!--fraces de validacion se muestran al cambiar clases is-valid o is-invalid ----- Buscar como modificar tipo de moneda en aria label-->
                <!-- <div class="invalid-feedback">Please enter a valid amount.</div>
          <div class="valid-feedback">Looks good!</div> -->
            </div>
            <div class="">
                <button type="submit" class="btn btn-primary">Depositar</button>
                <button id="boton-menu" type="button" class="btn btn-secondary">Volver al Menú Principal</button>
            </div>

        </form>

    </section>
    <script src="assets/js/script.js"></script>
</body>

</html>
