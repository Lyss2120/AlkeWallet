        </div>

          <!-- Depositar -->

          <!-- Enviar Dinero -->
          <a href="./sendmoney.html" class="btn btn-outline-light col-md-auto m-4 ">

          </a>

          <!-- Últimos Movimientos -->
          <a href="./transactions.html" class="btn btn-outline-light col-md-auto m-4 ">

          </a>

          <!-- Recargas -->
          <a href="#" class="btn btn-outline-light col-md-auto m-4 " data-bs-toggle="tooltip"

            <i class="bi bi-phone-vibrate fs-3"></i> <br>
            <span class="h5 m-0">Recargas</span>
          </a>
          <!-- Pago de Servicios -->
          <a href="#" class="btn btn-outline-light col-md-auto m-3" data-bs-toggle="tooltip"

            <i class="bi bi-receipt fs-3"></i> <br>
            <span class="h5 m-0">Pago Servicios</span>
          </a>

          <!-- Cobrar -->
          <a href="#" class="btn btn-outline-light col-md-auto m-4 " data-bs-toggle="tooltip"
            data-bs-title="Próximamente">

            <span class="h5 m-0">Cobro QR</span>
          </a>
          <!-- Mis Tarjetas -->
          <a href="#" class="btn btn-outline-light col-md-auto m-4 " data-bs-toggle="tooltip"
            data-bs-title="Próximamente">
            <i class="bi bi-credit-card fs-3"></i> <br>
            <span class="h5 m-0">Mis Tarjetas</span>
          </a>

          <!-- Seguridad -->
          <a href="#" class="btn btn-outline-light col-md-auto m-4 " data-bs-toggle="tooltip"
            data-bs-title="Próximamente">
            <i class="bi bi-shield-lock fs-3"></i> <br>
            <span class="h5 m-0">Seguridad</span>
          </a>

          <!-- Soporte -->
          <a href="#" class="btn btn-outline-light col-md-auto m-4 " data-bs-toggle="tooltip"
            data-bs-title="Próximamente">
            <i class="bi bi-chat-square-dots fs-3"></i> <br>
            <span class="h5 m-0">Soporte</span>
          </a>
        </div>
