<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlkeWallet</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="icon" type="image/png" href="/assets/img/aw-logo.png">

</head>

<body>
    <header id="header">
        <h1>AlkeWallet</h1>
    </header>
    <!-- formulario de login -->
    <main class="container">
        <form>
            <fieldset>

                <legend>
                    <h2>Login</h2>
                </legend>

                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password">
                </div>
                <!-- checkbox para futura persistencia de datos -->
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="checkbox">
                    <label class="form-check-label" for="checkbox">Recordarme</label>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </fieldset>
        </form>

        <button type="submit" class="btn btn-secondary">Volver al Menú Principal</button>

    </main>
</body>

</html>
